name: Release
on:
  pull_request:
    types: [closed, ready_for_review, converted_to_draft]
permissions:
  contents: read
jobs:
  fake-release:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p .release-notification
          printf '%s' '{"type":"release","publishedPackages":[{"name":"poc","version":"9.9.9"}],"pullRequestNumber":7}' > .release-notification/notification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
          retention-days: 1
      - run: echo "CLOSED_EVENT_PRODUCER_RAN"
